name: Daily Lead Collection - All 50 States

on:
  schedule:
    # Run daily at 6:00 AM CST (12:00 PM UTC)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  collect-leads:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        state: [
          'AL', 'AK', 'AZ', 'AR', 'CA', 'CO', 'CT', 'DE', 'FL', 'GA',
          'HI', 'ID', 'IL', 'IN', 'IA', 'KS', 'KY', 'LA', 'ME', 'MD',
          'MA', 'MI', 'MN', 'MS', 'MO', 'MT', 'NE', 'NV', 'NH', 'NJ',
          'NM', 'NY', 'NC', 'ND', 'OH', 'OK', 'OR', 'PA', 'RI', 'SC',
          'SD', 'TN', 'TX', 'UT', 'VT', 'VA', 'WA', 'WV', 'WI', 'WY'
        ]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create environment file
      run: |
        cat > .env << EOF
        GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
        GMAIL_USER=${{ secrets.GMAIL_USER }}
        GMAIL_PASSWORD=${{ secrets.GMAIL_PASSWORD }}
        REPORT_EMAIL=${{ secrets.REPORT_EMAIL }}
        EOF
        
    - name: Run lead collection for ${{ matrix.state }}
      run: |
        python bot.py --mode collect --states ${{ matrix.state }} --km-step 50
        
    - name: Upload leads data
      uses: actions/upload-artifact@v4
      with:
        name: leads-${{ matrix.state }}-${{ github.run_number }}
        path: |
          ${{ matrix.state }}-*/
          leads.csv
          leads.xlsx
          leads_call_sheet.xlsx
        retention-days: 30
        
    - name: Commit and push results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git diff --staged --quiet || git commit -m "Daily lead collection: ${{ matrix.state }} - $(date)"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
